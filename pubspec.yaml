name: restaurant_app
description: "This project is a fully-featured Flutter application designed to enhance the dining experience for users and streamline restaurant operations."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk:
      flutter
  google_fonts: ^6.2.1
  http: ^1.2.2
  lottie: ^3.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  sqflite: ^2.4.1
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      ref: b783000

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/loading.json
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

